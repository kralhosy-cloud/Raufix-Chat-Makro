name: build

# Builds the real mod jar on GitHub's runners, where Fabric's Maven, Mojang's
# libraries and the Gradle distribution are reachable. This is the build that
# produces an installable jar; the local scripts in scripts/ can only produce the
# platform-free core (see JAR.md).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish the jar to the ci-artifacts branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show what we are building
        run: |
          grep -E '^(minecraft_version|loader_version|yarn_mappings|fabric_version|loom_version)' gradle.properties

      - name: Resolve the Fabric coordinates for this Minecraft version
        run: python3 scripts/resolve-fabric-versions.py

      - name: Show the resolved coordinates
        run: |
          grep -E '^(minecraft_version|loader_version|yarn_mappings|fabric_version|loom_version)' gradle.properties
          cat gradle/wrapper/gradle-wrapper.properties

      # The build JVM has to be Java 25: Loom 1.20.0-alpha.27 refuses to load on
      # anything older. The produced bytecode is still Java 21 unless
      # gradle.properties' java_version says otherwise.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile with Loom (this is where client.** is compiled for real)
        shell: bash
        run: |
          set -o pipefail   # a failing gradlew must fail the step, even through tee
          ./gradlew --no-daemon --stacktrace build 2>&1 | tee gradle-build.log

      # Read the REAL yarn-mapped API from the jar Loom just downloaded, instead
      # of guessing signatures. Output goes into the build log we publish.
      - name: Probe the mapped Minecraft API (javap)
        if: always()
        shell: bash
        run: |
          set -u
          out=api-probe.log
          jar=$(ls .gradle/loom-cache/minecraftMaven/net/minecraft/minecraft-*/*/*-merged.jar 2>/dev/null | head -1)
          echo "jar=$jar" | tee "$out"
          if [ -z "${jar:-}" ]; then
            find .gradle -name '*minecraft*jar' | head -20 | tee -a "$out"; exit 0
          fi
          unzip -l "$jar" | grep -c class | tee -a "$out"
          for cls in net/minecraft/client/gui/Screen net/minecraft/client/gui/Element \
                     net/minecraft/client/gui/widget/ClickableWidget net/minecraft/client/gui/DrawContext \
                     net/minecraft/client/option/KeyBinding net/minecraft/command/CommandRegistryAccess; do
            { echo "===== $cls"; javap -classpath "$jar" "${cls//\//.}" 2>&1 | head -60; } >> "$out"
          done
          echo '--- inner types of KeyBinding/screen input ---' >> "$out"
          grep -E '^\s+(public|protected).*\(' "$out" | grep -iE 'mouseClicked|keyPressed|drawBorder|Category|DrawContext' | head -40 >> "$out"

      - name: Summarise the Gradle log in the job summary
        if: always()
        run: |
          {
            echo '### gradle-build.log (tail)'
            echo '```'
            tail -n 120 gradle-build.log 2>/dev/null || echo '(no log)'
            echo '```'
            echo '### first errors'
            echo '```'
            grep -nE "^(FAILURE|\* What went wrong|Caused by|> Could not|> A problem|error:)" -A4 gradle-build.log 2>/dev/null | head -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the Gradle log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      # The jar is the deliverable. Publish it to a dedicated branch so it is
      # reachable from environments that cannot download Actions artifacts.
      # A fresh worktree is used instead of mutating the checked-out tree: the
      # earlier version of this step did `git rm -rf --cached .` and left the
      # repository in a state where the publish itself failed.
      - name: Publish the built jar to the ci-artifacts branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          PUB="$RUNNER_TEMP/pub"
          rm -rf "$PUB"
          mkdir -p "$PUB"
          cp gradle-build.log "$PUB"/ 2>/dev/null || echo '(no gradle log)' > "$PUB/gradle-build.log"
          cp api-probe.log "$PUB"/ 2>/dev/null || true
          [ -d build/libs ] && find build/libs -name '*.jar' -exec cp {} "$PUB"/ \; || true
          ( cd "$PUB" && sha256sum * > SHA256SUMS.txt 2>/dev/null || true )
          echo "--- publishing:"
          ls -l "$PUB"
          cd "$PUB"
          git init -q -b ci-artifacts .
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "build ${GITHUB_SHA:0:7}: artifacts" || echo 'nothing to commit'
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts:ci-artifacts

      - name: List produced artifacts
        if: always()
        run: |
          echo '--- build/libs'
          ls -la build/libs || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-macro-studio-jars
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
