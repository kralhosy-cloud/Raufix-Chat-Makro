name: build

# Builds the real mod jar on GitHub's runners, where Fabric's Maven, Mojang's
# libraries and the Gradle distribution are reachable. This is the build that
# produces an installable jar; the local scripts in scripts/ can only produce the
# platform-free core (see JAR.md).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what we are building
        run: |
          grep -E '^(minecraft_version|loader_version|yarn_mappings|fabric_version|loom_version)' gradle.properties

      - name: Resolve the Fabric coordinates for this Minecraft version
        run: python3 scripts/resolve-fabric-versions.py

      - name: Show the resolved coordinates
        run: |
          grep -E '^(minecraft_version|loader_version|yarn_mappings|fabric_version|loom_version)' gradle.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile with Loom (this is where client.** is compiled for real)
        run: ./gradlew --no-daemon --stacktrace build 2>&1 | tee gradle-build.log

      - name: Summarise the Gradle log in the job summary
        if: always()
        run: |
          {
            echo '### gradle-build.log (tail)'
            echo '```'
            tail -n 120 gradle-build.log 2>/dev/null || echo '(no log)'
            echo '```'
            echo '### first errors'
            echo '```'
            grep -nE "^(FAILURE|\* What went wrong|Caused by|> Could not|> A problem|error:)" -A4 gradle-build.log 2>/dev/null | head -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the Gradle log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      # The jar is the deliverable. Committing it back to a dedicated branch makes
      # it reachable from environments that cannot download Actions artifacts.
      - name: Publish the built jar to the ci-artifacts branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/pub
          cp gradle-build.log /tmp/pub/ 2>/dev/null || true
          find build/libs -name '*.jar' -exec cp {} /tmp/pub/ \; 2>/dev/null || true
          ls -l build/libs /tmp/pub || true
          ( cd /tmp/pub && sha256sum * > SHA256SUMS.txt 2>/dev/null || true )
          git checkout --orphan ci-artifacts-tmp 2>/dev/null || git checkout -B ci-artifacts-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf ./* 2>/dev/null || true
          cp -r /tmp/pub/. . 2>/dev/null || true
          git add -A
          git commit -m "build ${GITHUB_SHA:0:7}: artifacts from ${{ github.workflow }}" || echo 'nothing to commit'
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-artifacts

      - name: List produced artifacts
        if: always()
        run: |
          echo '--- build/libs'
          ls -la build/libs || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-macro-studio-jars
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
