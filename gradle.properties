# ============================================================================
# Chat Macro Studio - build configuration
# ============================================================================
# Everything version-related lives here so it can be re-pinned in one place.
#
# VERIFICATION STATUS (read this before building)
# -----------------------------------------------
# This repository was authored in a sandbox whose network egress is limited to
# github.com / codeload.github.com / api.github.com / registry.npmjs.org /
# pypi.org / files.pythonhosted.org.  meta.fabricmc.net, maven.fabricmc.net,
# repo.maven.apache.org, libraries.minecraft.net and services.gradle.org were
# all unreachable (curl returned HTTP 000), so the values marked UNVERIFIED
# below could NOT be confirmed against Fabric metadata while writing this file.
#
#   * minecraft_version : required by the user, taken as given.
#   * loader_version    : required by the user, pinned EXACTLY to 0.19.3.
#                         In the Fabric metadata for 1.21.11 this loader entry
#                         carries "stable": false - that field is reported as-is
#                         and is not silently overridden.  0.19.3 is a hard
#                         requirement, so it is not replaced by a "stable" build.
#   * yarn_mappings     : UNVERIFIED - confirm the build number.
#   * loom_version      : UNVERIFIED - confirm the Loom line that supports the
#                         Minecraft/Fabric pair above.
#   * fabric_version    : UNVERIFIED - confirm the Fabric API build for 1.21.11.
#
# Run scripts/sync-versions.sh on a machine with unrestricted network access to
# fill the UNVERIFIED values in from meta.fabricmc.net automatically.
# ============================================================================

# --- pinned by the user -----------------------------------------------------
minecraft_version=1.21.11
loader_version=0.19.3

# --- UNVERIFIED OFFLINE - run scripts/sync-versions.sh to confirm -----------
yarn_mappings=1.21.11+build.1
loom_version=1.11-SNAPSHOT
fabric_version=0.0.0+1.21.11

# --- mod coordinates --------------------------------------------------------
mod_id=chatmacro_studio
mod_name=Chat Macro Studio
mod_version=1.0.0
maven_group=dev.chatmacro.studio
archives_base_name=chat-macro-studio

# --- toolchain --------------------------------------------------------------
java_version=21

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
